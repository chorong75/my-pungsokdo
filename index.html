<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 풍속도</title>
<style>
:root{color-scheme:light;--paper:#f4eee2;--panel:#fffaf0;--ink:#302c25;--muted:#665d50;--line:#d8cbbb;--red:#8b4036;--green:#3c594f}
*{box-sizing:border-box}
body{margin:0;height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);color:var(--ink);background:var(--paper);font:16px/1.45 "Malgun Gothic",system-ui,sans-serif}
header{border-bottom:1px solid var(--line)}
.head,main{width:100%;max-width:1320px;margin-inline:auto;padding-inline:clamp(10px,2.2vw,24px)}
.head{display:flex;align-items:center;gap:12px;min-height:64px}
.seal{display:grid;place-items:center;width:43px;height:43px;flex:none;background:var(--red);color:white;border-radius:3px;outline:1px solid #ffffff80;outline-offset:-5px;font:24px "Batang",serif}
h1,h2,p{margin:0}
h1{font:700 clamp(22px,3vw,30px)/1.2 "Batang",serif;letter-spacing:-.06em}
.kicker{font-size:11px;color:var(--red);font-weight:bold;letter-spacing:.07em;margin-bottom:2px}
.head button{margin-left:auto;white-space:nowrap}
main{display:grid;grid-template-columns:clamp(218px,24vw,294px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:clamp(8px,1.6vw,20px);padding-block:10px;align-items:start;min-height:0;container-type:inline-size}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.controls{padding:12px;display:grid;gap:8px}
h2{font-size:17px;letter-spacing:-.04em}
small,.hint{font-size:13px;color:var(--muted)}
fieldset{padding:0;margin:0;border:0;min-width:0}
legend,label{font-size:13px;font-weight:bold}
.options{display:grid;gap:6px;min-width:0}
.options label{display:grid;gap:4px}
.segment{display:flex;gap:6px;margin-top:4px}
.segment label{position:relative;flex:1;display:block}
.segment input{position:absolute;opacity:0}
.segment span,button,select{font:inherit;border:1px solid var(--line);border-radius:7px;background:#fffdf8;color:var(--ink);min-height:44px}
.segment span{display:grid;place-items:center;cursor:pointer}
.segment input:checked+span{background:#e4ebe4;border-color:var(--green);color:#273f37;font-weight:bold}
:focus-visible,.segment input:focus-visible+span{outline:3px solid #a2601f;outline-offset:2px}
select{padding:6px 8px;width:100%;min-width:0;max-width:100%}
button{padding:7px 13px;cursor:pointer;font-weight:bold;font-size:14px}
button:hover:not(:disabled){background:#f2e8d8}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--green);border-color:var(--green);color:white}
button.primary:hover:not(:disabled){background:#294439}
#save{background:var(--red);border-color:var(--red);color:white}
#save:hover:not(:disabled){background:#733329}
.preview{min-width:0;background:#f5eddd;border:1px solid var(--line);border-radius:8px;text-align:center}
.preview svg{display:block;width:100%;height:clamp(52px,calc(100dvh - 423px),142px)}
.preview p{padding:0 5px 5px;overflow-wrap:anywhere}
#add{width:100%}
.asset-note{display:block}
.scene{width:min(100%,calc(67% + 8px));height:min(100%,calc(67cqw - 72px));display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.bar{display:flex;gap:6px 10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:7px 10px;min-width:0}
.bar label{display:flex;gap:6px;align-items:center;max-width:100%}
.bar select{width:auto}
.board{background:#e7dece;padding:7px;min-height:0;min-width:0;container-type:size;display:grid;place-items:center}
#stage{width:min(100cqw,100cqh);height:auto;display:block;aspect-ratio:1;outline:1px solid #bba98e;box-shadow:0 4px 14px #4a35201d;background:repeating-conic-gradient(#ddd4c5 0% 25%,#f6efe3 0% 50%) 0/20px 20px;touch-action:none;user-select:none}
#people>g{cursor:grab}
#stage.dragging #people>g{cursor:grabbing}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools button{font-size:13px;padding-inline:9px}
.footer{border-top:1px solid var(--line)}
#status{overflow-wrap:anywhere}
@media(max-width:980px){
  .scene{height:100%}
  .scene .bar .hint:not(#count):not(#status){display:none}
}
@media(max-height:650px){
  .head{min-height:54px}
  .controls{gap:5px;padding:8px}
  .options{gap:4px}
  .options label{gap:2px}
  .segment span,button,select{min-height:36px}
  #editHint,.asset-note{display:none}
  .bar{padding:5px 8px}
}
@media(max-width:760px){
  .head{gap:8px;min-height:54px}
  .seal{width:36px;height:36px}
  .head button{padding-inline:8px}
  main{grid-template-columns:minmax(158px,33%) minmax(0,1fr);gap:7px;padding-block:6px}
  .scene{width:100%}
  .kicker{letter-spacing:0}
}
@media(max-width:760px) and (orientation:portrait){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);align-items:stretch}
  .controls{grid-template-columns:minmax(0,1fr) minmax(70px,29%);gap:5px 8px;padding:7px}
  .controls>div:first-child,.controls>small,#add{grid-column:1/-1}
  .controls>small,#editHint{display:none}
  .preview{align-self:stretch;display:grid;align-content:center}
  .preview svg{height:clamp(58px,16dvh,105px)}
  .segment span,button,select{min-height:36px}
  .bar{padding:5px 8px}
}
@media(max-height:460px) and (orientation:landscape){
  .head{min-height:44px}
  .seal{width:32px;height:32px}
  .kicker,.preview p,.scene .bar .hint:not(#count):not(#status){display:none}
  .segment span,button,select{min-height:30px;padding-block:3px}
  .preview svg{height:clamp(35px,calc(100dvh - 270px),90px)}
  .controls{gap:4px}
}
</style>
</head>

  <button id="save" type="button">PNG 저장</button>

    <div class="options">

    <button id="add" class="primary" type="button">＋ 그림에 인물 추가</button>
    <small id="assetNote" class="asset-note"></small>
  </aside>

        <option value="palace">궁궐</option><option value="school">서당</option><option value="hanok">한옥</option>
        <option value="wall">돌담길</option><option value="market">장터</option>
        <option value="bridge">개울가 돌다리</option><option value="rain">비 오는 골목</option>
        <option value="yard">마루 앞 마당</option><option value="bench">나무 그늘 아래 평상</option>
        <option value="pond">연못가 정자</option><option value="tavern">주막</option>
        <option value="room">한지 창호가 있는 방</option><option value="cowshed">소가 있는 외양간</option>
        <option value="feast">잔칫집</option><option value="clear">투명</option>
      </select></label>
    </div>
    <div class="board">
      <svg id="stage" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" aria-label="풍속도 작업 영역">
        <g id="back" aria-hidden="true"></g>
        <g id="people"></g>
        <g id="selection" pointer-events="none" aria-hidden="true"></g>
      </svg>
    </div>
    <div class="bar footer">
      <div><p id="count" class="hint"></p><p id="status" class="hint" role="status"></p></div>
      <div class="tools" aria-label="선택한 인물 편집">
        <button id="flip" type="button">좌우 반전</button>
        <button id="front" type="button">맨 앞으로</button>
        <button id="remove" type="button">인물 지우기</button>
      </div>
    </div>
  </section>
</main>

function limb(start, bend, end, width, cuff, color, bands, openRoot=false) {
  const normal=(a,b)=>{
    const dx=b[0]-a[0], dy=b[1]-a[1], length=Math.hypot(dx,dy)||1;
    return [-dy/length,dx/length];
  };
  const upper=normal(start,bend), lower=normal(bend,end);
  const offset=(point,side,amount)=>point.map((value,i)=>value+side[i]*amount);
  const middle=(a,b)=>a.map((value,i)=>(value+b[i])/2);
  const edge=direction=>{
    const root=offset(start,upper,direction*width);
    const jointIn=offset(bend,upper,direction*width*1.06);
    const jointOut=offset(bend,lower,direction*width*1.06);
    const tip=offset(end,lower,direction*cuff);
    return {root,joint:middle(jointIn,jointOut),before:middle(root,jointIn),after:middle(jointOut,tip),tip};
  };
  const a=edge(1), b=edge(-1);
  const outline='M'+a.root+' L'+a.before+' Q'+a.joint+' '+a.after+' L'+a.tip+
    ' L'+b.tip+' L'+b.after+' Q'+b.joint+' '+b.before+' L'+b.root;
  const fill=openRoot?'<g stroke="none">'+shape(outline+' Z',color)+'</g>':shape(outline+' Z',color);

  return fill+'<g stroke="none">'+sections+'</g>'+line(outline,ink,1.45);

const ns="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
const stage=$("stage"), people=$("people"), back=$("back"), selection=$("selection");
const actorScale=2.1;
const stageSize=900;
const exportSize=stageSize*2;
const actors=[];
let selected=null, nextId=1, drag=null, exportUrl;
const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
const describe=a=>[a.person==="woman"?"여자":"남자",poses[a.pose].label,outfits[a.outfit].label].join(" · ");
const announce=message=>{$("status").textContent=message;};
function currentStyle(){
  return {person:document.querySelector('input[name="person"]:checked').value,pose:$("pose").value,outfit:$("outfit").value};
}
function syncPreview(){
  const appearance=currentStyle();
  $("preview").innerHTML=character(appearance);
  $("previewLabel").textContent=poses[appearance.pose].label;
}
function transform(actor){
  return 'translate('+actor.x+' '+actor.y+') scale('+(actor.flip?-actorScale:actorScale)+' '+actorScale+')';
}
function selectActor(actor){
  selected=actor;
  $("editHint").textContent=actor?"선택한 인물을 편집 중이에요. 빈 곳을 누르면 선택이 풀려요.":"동작과 한복을 골라 보세요.";
  for(const item of actors) item.node.setAttribute("aria-pressed",String(item===actor));
  $("flip").disabled=$("front").disabled=$("remove").disabled=!actor;
  selection.replaceChildren();
  if(!actor)return;
  const box=actor.node.getBBox();
  const frame=document.createElementNS(ns,"rect");
  for(const [key,value] of Object.entries({x:box.x-6,y:box.y-6,width:box.width+12,height:box.height+12,rx:5,fill:"none",stroke:"#527160","stroke-width":2,"stroke-dasharray":"5 4"}))frame.setAttribute(key,value);
  selection.append(frame);
  selection.setAttribute("transform",transform(actor));
}
function setPosition(actor,x,y){
  const box=actor.node.getBBox();
  const minX=actor.flip?-box.x-box.width:box.x;
  const maxX=actor.flip?-box.x:box.x+box.width;
  actor.x=clamp(x,8-minX*actorScale,stageSize-8-maxX*actorScale);
  actor.y=clamp(y,8-box.y*actorScale,stageSize-8-(box.y+box.height)*actorScale);
  actor.node.setAttribute("transform",transform(actor));
  if(actor===selected)selection.setAttribute("transform",transform(actor));
}
function updateActor(actor,appearance){
  Object.assign(actor,appearance);
  actor.node.innerHTML=character(actor);
  actor.node.setAttribute("aria-label","인물 "+actor.id+" · "+describe(actor));
  setPosition(actor,actor.x,actor.y);
  if(actor===selected)selectActor(actor);
}
function changeAppearance(){
  syncPreview();
  if(selected)updateActor(selected,currentStyle());
}
function activate(actor){
  $("pose").value=actor.pose;
  $("outfit").value=actor.outfit;
  document.querySelector('input[name="person"][value="'+actor.person+'"]').checked=true;
  syncPreview();
  selectActor(actor);
}
function updateCount(){
  $("count").textContent="인물 "+actors.length+"명 · "+exportSize+" × "+exportSize+" px";
}
function addActor(appearance,x,y){
  const node=document.createElementNS(ns,"g");
  const actor={id:nextId++,x,y,flip:false,node};
  node.setAttribute("tabindex","0");
  node.setAttribute("role","button");
  actors.push(actor);
  people.append(node);
  updateActor(actor,appearance);
  node.addEventListener("focus",()=>activate(actor));
  node.addEventListener("pointerdown",event=>{
    if(event.button!==0||drag)return;
    event.preventDefault();
    node.focus({preventScroll:true});
    activate(actor);
    const point=pointAt(event);
    drag={actor,id:event.pointerId,dx:actor.x-point.x,dy:actor.y-point.y};
    stage.setPointerCapture(event.pointerId);
    stage.classList.add("dragging");
  });
  node.addEventListener("keydown",event=>{
    const offsets={ArrowLeft:[-8,0],ArrowRight:[8,0],ArrowUp:[0,-8],ArrowDown:[0,8]};
    const offset=offsets[event.key];
    if(offset){
      event.preventDefault();
      setPosition(actor,actor.x+offset[0],actor.y+offset[1]);
    }else if(event.key==="Delete"){
      event.preventDefault();
      removeActor();
    }else if(event.key==="Enter"||event.key===" "){
      event.preventDefault();
      activate(actor);
    }
  });
  updateCount();
  return actor;
}
function pointAt(event){
  return new DOMPoint(event.clientX,event.clientY).matrixTransform(stage.getScreenCTM().inverse());
}
stage.addEventListener("pointermove",event=>{
  if(!drag||drag.id!==event.pointerId)return;
  const point=pointAt(event);
  setPosition(drag.actor,point.x+drag.dx,point.y+drag.dy);
});
for(const type of ["pointerup","pointercancel","lostpointercapture"]){
  stage.addEventListener(type,event=>{
    if(!drag||drag.id!==event.pointerId)return;
    drag=null;
    stage.classList.remove("dragging");
  });
}
stage.addEventListener("pointerdown",event=>{
  if(!people.contains(event.target)){
    selectActor(null);
    announce("새 인물의 동작과 의상을 고를 수 있어요.");
  }
});
function removeActor(){
  if(!selected)return;
  actors.splice(actors.indexOf(selected),1);
  selected.node.remove();
  selectActor(null);
  $("add").focus({preventScroll:true});
  updateCount();
  announce("인물을 지웠어요.");
}
function refreshBackground(){back.innerHTML=backgrounds[$("background").value];}

async function savePng(){
  const button=$("save");
  button.disabled=true;
  announce("PNG를 만드는 중이에요.");
  let svgUrl;
  try{
    const copy=stage.cloneNode(true);
    copy.querySelector("#selection").remove();
    copy.setAttribute("width",exportSize);
    copy.setAttribute("height",exportSize);
    svgUrl=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copy)],{type:"image/svg+xml;charset=utf-8"}));
    const image=new Image();
    image.src=svgUrl;
    await image.decode();
    const output=document.createElement("canvas");
    output.width=exportSize;
    output.height=exportSize;
    output.getContext("2d").drawImage(image,0,0);
    const blob=await new Promise(resolve=>output.toBlob(resolve,"image/png"));
    if(!blob)throw new Error("PNG encoding failed");
    if(exportUrl)URL.revokeObjectURL(exportUrl);
    exportUrl=URL.createObjectURL(blob);
    const link=document.createElement("a");
    link.href=exportUrl;
    link.download="나만의-풍속도.png";
    document.body.append(link);
    link.click();
    link.remove();
    announce("PNG 다운로드를 요청했어요. 브라우저의 다운로드 목록을 확인하세요.");
  }catch(error){
    console.error(error);
    announce("PNG 저장에 실패했어요. 잠시 후 다시 눌러 주세요.");
  }finally{
    if(svgUrl)URL.revokeObjectURL(svgUrl);
    button.disabled=false;
  }
}
for(const [id,options] of [["pose",poses],["outfit",outfits]]){
  for(const [value,item] of Object.entries(options))$(id).add(new Option(item.label,value));
  $(id).addEventListener("change",changeAppearance);
}
$("assetNote").textContent="시험용 SVG 그림 · 인물 2종 · 동작 "+Object.keys(poses).length+"종 · 의상 "+Object.keys(outfits).length+"종";
document.querySelectorAll('input[name="person"]').forEach(input=>input.addEventListener("change",changeAppearance));
$("background").addEventListener("change",refreshBackground);
$("add").addEventListener("click",()=>{
  const i=(nextId-1)%12;
  const actor=addActor(currentStyle(),205+(i%4)*164,460+Math.floor(i/4)*105);
  activate(actor);
  announce("인물을 추가했어요.");
});
$("flip").addEventListener("click",()=>{
  selected.flip=!selected.flip;
  setPosition(selected,selected.x,selected.y);
  announce("인물의 방향을 뒤집었어요.");
});
$("front").addEventListener("click",()=>{
  people.append(selected.node);
  announce("선택한 인물을 맨 앞으로 옮겼어요.");
});
$("remove").addEventListener("click",removeActor);
$("save").addEventListener("click",savePng);

refreshBackground();
addActor({person:"man",pose:"walk",outfit:"vest"},240,526);
addActor({person:"woman",pose:"read",outfit:"skirt"},455,630);
addActor({person:"man",pose:"phone",outfit:"white"},660,508);
selectActor(null);
syncPreview();
announce("예시 인물 3명을 배치했어요. 클릭하면 수정할 수 있어요.");
</script>
